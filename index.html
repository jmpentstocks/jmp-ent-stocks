<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35313d">
<title>JMP Ent Stocks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">

<style>
.hidden{display:none!important}

.screen{
  max-width:700px;
  margin:auto;
  padding:25px 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:100%;
  max-width:360px;
  height:auto;
  display:block;
  margin:0 auto;
}

.brand h1{
  margin:0;
}

.brand p,.topbar p{
  margin:5px 0;
  color:#777;
}

.subtitle{
  color:#777;
}

.loginbox,.panel{
  background:#fff;
  border:1px solid #ddd;
  border-radius:20px;
  padding:20px;
  margin-top:18px;
}

.label{
  display:block;
  font-size:12px;
  font-weight:bold;
  color:#777;
  margin:15px 0 7px;
}

.loginbox input,.qtybox input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
  box-sizing:border-box;
}

.primary,.action,.ghost,.product,.save,.cancel{
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary,.save{
  background:#35313d;
  color:#fff;
  border:0;
}

.primary{
  width:100%;
  margin-top:12px;
}

.message{
  color:#b44;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.ghost{
  background:#fff;
  border:1px solid #ccc;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.action{
  background:#fff;
  border:1px solid #35313d;
  min-height:70px;
}

.inventory{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  border:1px solid #ddd;
  border-radius:13px;
}

.item b{
  display:block;
}

.item small{
  display:block;
  color:#777;
  margin-top:4px;
}

.qty{
  font-size:20px;
  font-weight:bold;
}

.badge{
  margin-left:8px;
  padding:5px 8px;
  border-radius:7px;
  background:#e8f5e9;
  color:#28763a;
  font-size:11px;
}

.low{
  background:#fff0df;
  color:#b86600;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:99;
}

.modalbox{
  background:#fff;
  border-radius:20px;
  padding:20px;
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow:auto;
}

.product{
  display:flex;
  justify-content:space-between;
  width:100%;
  margin:7px 0;
  background:#fff;
  border:1px solid #ddd;
  text-align:left;
}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.row>*{
  flex:1;
}

/* Company logo */
.company-logo{
  width:100%;
  max-width:300px;
  height:auto;
  display:block;
  margin:0 auto 22px;
}

/* Dashboard logo area */
.dashboard-logo{
  background:#fff;
  border:1px solid #e5ddd5;
  border-radius:20px;
  padding:6px 14px;
  margin-bottom:18px;
}

@media(max-width:500px){
  .screen{
    padding:20px 14px;
  }

  .company-logo{
    max-width:100%;
    margin-bottom:18px;
  }

  .dashboard-logo{
    padding:10px;
    margin-bottom:14px;
  }

  .topbar{
    gap:10px;
  }

  .topbar h1{
    font-size:22px;
  }

  .topbar p{
    font-size:14px;
  }

  .actions{
    gap:9px;
    margin:15px 0;
  }

  .action{
    min-height:62px;
    padding:11px 8px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<main id="app">

<section id="loginScreen" class="screen">

  <div class="dashboard-logo">
    <img
      src="./JMP%20Logo.jpg"
      class="company-logo"
      alt="JMP Parekh Enterprises">
  </div>

  <div class="brand">
    <div>
      <h1>JMP Ent Stocks</h1>
      <p>Inventory Management</p>
    </div>
  </div>

  <p class="subtitle">Sign in to continue.</p>

  <div class="loginbox">

    <label class="label">ACCESS CODE</label>
    <input
      id="accessCode"
      autocomplete="username"
      placeholder="Enter access code">

    <label class="label">PASSWORD</label>
    <input
      id="pin"
      type="password"
      autocomplete="current-password"
      placeholder="Enter password">

    <button
      id="signIn"
      class="primary"
      type="button">
      Sign In
    </button>

    <p id="loginMsg" class="message"></p>

  </div>

</section>


<section id="homeScreen" class="screen hidden">

  <div class="dashboard-logo">
    <img
      src="./JMP%20Logo.jpg"
      class="company-logo"
      alt="JMP Parekh Enterprises">
  </div>

  <header class="topbar">
    <div>
      <h1>JMP Ent Stocks</h1>
      <p id="welcome"></p>
    </div>

    <button
      id="logout"
      class="ghost"
      type="button">
      Logout
    </button>
  </header>


  <div class="actions">

    <button
      id="stockIn"
      class="action"
      type="button">
      📥 Stock IN
    </button>

    <button
      id="stockOut"
      class="action"
      type="button">
      📤 Stock OUT
    </button>

  </div>


  <div id="adminActions" class="panel hidden">

    <h2>Admin Dashboard</h2>

    <div class="actions">

      <button
        id="manageProducts"
        class="action"
        type="button">
        📦 Products
      </button>

      <button
        id="manageCategories"
        class="action"
        type="button">
        📁 Categories
      </button>

      <button
        id="transactions"
        class="action"
        type="button">
        📋 Transactions
      </button>

      <button
        id="workers"
        class="action"
        type="button">
        👥 Workers
      </button>
      <button
  id="pasteStockUpdate"
  class="action"
  type="button">
  📋 Paste Stock Update
</button>

    </div>

  </div>


  <!-- NORMAL / WORKER INVENTORY -->

<div id="workerInventoryPanel" class="panel">

  <h2>Inventory</h2>

  <div
    id="inventoryList"
    class="inventory">
    Loading...
  </div>

</div>


<!-- ADMIN INVENTORY DASHBOARD -->

<div id="adminInventoryPanel" class="panel hidden">

  <h2>Inventory</h2>


  <!-- STOCK VIEW -->

  <p class="inventory-label">
    STOCK VIEW
  </p>

  <div class="stock-tabs">

    <button
      class="stock-tab"
      data-stock-view="kumar"
      type="button">
      Kumar
    </button>

    <button
      class="stock-tab"
      data-stock-view="office"
      type="button">
      Office
    </button>

    <button
      class="stock-tab active"
      data-stock-view="consolidated"
      type="button">
      Consolidated
    </button>

  </div>


  <!-- CATEGORY FILTER -->

  <p class="inventory-label">
    CATEGORIES
  </p>

  <div
    id="adminCategoryTabs"
    class="category-tabs">
    Loading categories...
  </div>


  <!-- PRODUCT SEARCH -->

  <input
    id="adminProductSearch"
    class="inventory-search"
    type="search"
    placeholder="🔍 Search product...">


  <!-- ADMIN PRODUCT LIST -->

  <div
    id="adminInventoryList"
    class="inventory"
    style="margin-top:15px">
    Loading...
  </div>

</div>

</section>

</main>

</body>
</html>
